    <style>
        main a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }

        main a:hover {
            color: var(--highlight);
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- COMMON HEADER START -->
        <header class="site-header">
            <h1 class="brand-name">Sourav Tripathy</h1>
            <nav class="tabs">
                <a href="/" class="tab-btn">About</a>
                <a href="/blog/" class="tab-btn">Blog</a>
                <a href="/projects/" class="tab-btn active">Projects</a>
                <a href="/curations/" class="tab-btn">Curations</a>
                <a href="/now/" class="tab-btn">Now</a>
                <a href="/observatory/" class="tab-btn">Observatory</a>
            </nav>
        </header>
        <!-- COMMON HEADER END -->

        <main>
            <div class="subtitle" style="font-size: 1.1rem; margin-bottom: 2rem; line-height: 1.6;">
                Below are some projects I've built that are publicly available; for other projects, check out my <a
                    href="https://github.com/Sourav-Tripathy" target="_blank">GitHub</a>.
            </div>

            <!-- Projects Section -->
            <section id="projects" class="tab-content">
                <!-- Projects injected via project.js -->
            </section>
        </main>

        <!-- COMMON FOOTER START -->
        <footer>
            <div class="social-links" style="margin-bottom: 2rem;">
                <a href="mailto:lipuntripathy74@gmail.com" target="_blank">Email</a>
                <a href="https://x.com/EssenceThinker" target="_blank">X (Twitter)</a>
                <a href="https://www.linkedin.com/in/sourav-tripathy-astrophile/" target="_blank">LinkedIn</a>
                <a href="https://github.com/Sourav-Tripathy" target="_blank">GitHub</a>
                <a href="https://letterboxd.com/essenceX/" target="_blank">Letterboxd</a>
                <a href="https://www.goodreads.com/user/show/82254166-sourav-tripathy" target="_blank">Goodreads</a>
            </div>
            © <span id="year"></span> Sourav Tripathy
        </footer>
        <!-- COMMON FOOTER END -->
    </div>

    <script src="project.js"></script>
    <script>
        const projectsContainer = document.getElementById('projects');
        projects.forEach((project, index) => {
            const projectDiv = document.createElement('div');
            projectDiv.className = 'info-block fade-in-item';
            projectDiv.style.borderLeftColor = project.highlightColor || 'var(--highlight)';
            projectDiv.style.animationDelay = `${index * 0.2}s`;

            projectDiv.innerHTML = `
                <span class="label" style="text-transform: none;">${project.category}</span>
                <span class="value"><a href="${project.url}" target="_blank"
                        style="text-decoration: none;">${project.title}</a></span>
                <div class="sub-info" style="margin-top: 0.5rem; font-style: normal;">
                    <p style="margin: 0;">
                        ${project.description}
                    </p>
                    <p style="margin-top: 0.5rem; color: var(--accent); font-size: 0.85rem;">
                        ${project.footerHtml}
                    </p>
                </div>
            `;
            projectsContainer.appendChild(projectDiv);
        });
    </script>
    <script src="../blog/articles.js"></script>
    <script src="../script.js"></script>
    <script src="../globe.js"></script>
</body>

</html>
